<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" width="720" height="150" role="img" aria-label="Gloop's closed notch, looking around and blinking, with a hint to click him">
  <defs>
    <clipPath id="frame"><rect width="720" height="150" rx="18"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <g clip-path="url(#frame)" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif">
    <rect width="720" height="150" fill="#12152A"/>
    <g filter="url(#soft)">
      <circle cx="140" cy="150" r="120" fill="#2A3F8F" opacity="0.6"/>
      <circle cx="600" cy="20" r="110" fill="#5B2A8F" opacity="0.45"/>
    </g>

    <!-- he breathes: a slow wobble of the notch -->
    <rect x="285" y="-24" width="150" height="64" rx="24" fill="#050608" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5">
      <animate attributeName="width" values="150;158;150" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <animate attributeName="x" values="285;281;285" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <animate attributeName="height" values="64;61;64" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>

    <!-- eyes wander: left, right, down at you -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" values="0 0;-8 2;-8 2;8 2;8 2;0 6;0 6;0 0" keyTimes="0;0.12;0.3;0.42;0.6;0.7;0.92;1" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1"/>
      <g filter="url(#glow)" fill="#4FB4FF" opacity="0.9">
        <ellipse cx="345" cy="19" rx="8" ry="10"><animate attributeName="ry" dur="6s" repeatCount="indefinite" values="10;10;1.5;10;10;1.5;10;10" keyTimes="0;0.34;0.36;0.38;0.8;0.82;0.84;1"/></ellipse>
        <ellipse cx="375" cy="19" rx="8" ry="10"><animate attributeName="ry" dur="6s" repeatCount="indefinite" values="10;10;1.5;10;10;1.5;10;10" keyTimes="0;0.34;0.36;0.38;0.8;0.82;0.84;1"/></ellipse>
      </g>
      <g fill="#EAF6FF">
        <ellipse cx="345" cy="19" rx="6" ry="8"><animate attributeName="ry" dur="6s" repeatCount="indefinite" values="8;8;1;8;8;1;8;8" keyTimes="0;0.34;0.36;0.38;0.8;0.82;0.84;1"/></ellipse>
        <ellipse cx="375" cy="19" rx="6" ry="8"><animate attributeName="ry" dur="6s" repeatCount="indefinite" values="8;8;1;8;8;1;8;8" keyTimes="0;0.34;0.36;0.38;0.8;0.82;0.84;1"/></ellipse>
      </g>
    </g>

    <!-- the hint -->
    <g fill="#C9D6F0">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="1.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <path d="M360 72v-14M353 64l7-7 7 7" fill="none" stroke="#C9D6F0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="360" y="104" text-anchor="middle" font-size="18" font-weight="600">Click to poke him</text>
      <text x="360" y="128" text-anchor="middle" font-size="13" fill="#8D92A0">(this one works right here in the README)</text>
    </g>
  </g>
</svg>
