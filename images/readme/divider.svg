<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 48" width="960" height="48" role="img" aria-label="A line of goo with drops forming and falling">
  <g fill="#5A6072">
    <rect x="0" y="6" width="960" height="4" rx="2"/>
    <!-- three drips, out of step with each other -->
    <ellipse cx="180" cy="10" rx="5" ry="0">
      <animate attributeName="ry" values="0;6;8;0;0" keyTimes="0;0.4;0.55;0.56;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="10;14;18;10;10" keyTimes="0;0.4;0.55;0.56;1" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="180" cy="20" r="0">
      <animate attributeName="r" values="0;0;4;3;0" keyTimes="0;0.55;0.56;0.9;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="20;20;22;46;46" keyTimes="0;0.55;0.56;0.9;1" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0 0 1 1;0.6 0 1 1;0 0 1 1"/>
    </circle>
    <ellipse cx="530" cy="10" rx="6" ry="0">
      <animate attributeName="ry" values="0;7;9;0;0" keyTimes="0;0.4;0.55;0.56;1" dur="5.2s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="10;15;19;10;10" keyTimes="0;0.4;0.55;0.56;1" dur="5.2s" begin="1.3s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="530" cy="22" r="0">
      <animate attributeName="r" values="0;0;5;4;0" keyTimes="0;0.55;0.56;0.9;1" dur="5.2s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="22;22;24;46;46" keyTimes="0;0.55;0.56;0.9;1" dur="5.2s" begin="1.3s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0 0 1 1;0.6 0 1 1;0 0 1 1"/>
    </circle>
    <ellipse cx="810" cy="10" rx="4" ry="0">
      <animate attributeName="ry" values="0;5;7;0;0" keyTimes="0;0.4;0.55;0.56;1" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="10;13;16;10;10" keyTimes="0;0.4;0.55;0.56;1" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="810" cy="18" r="0">
      <animate attributeName="r" values="0;0;3;2.5;0" keyTimes="0;0.55;0.56;0.9;1" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="18;18;20;46;46" keyTimes="0;0.55;0.56;0.9;1" dur="3.6s" begin="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0 0 1 1;0.6 0 1 1;0 0 1 1"/>
    </circle>
  </g>
</svg>
