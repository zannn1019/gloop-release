<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" role="img" aria-label="Gloop asleep: his notch with closed eyes, breathing slowly, with little z's floating up">
  <g font-family="'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif">
    <rect x="165" y="16" width="150" height="48" rx="24" fill="#050608" stroke="#8D92A0" stroke-opacity="0.35" stroke-width="1.5">
      <animate attributeName="width" values="150;160;150" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <animate attributeName="x" values="165;160;165" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </rect>
    <g fill="none" stroke="#9FD3FF" stroke-width="3" stroke-linecap="round">
      <path d="M216 40q9 7 18 0"/>
      <path d="M246 40q9 7 18 0"/>
    </g>
    <g fill="#8D92A0" font-weight="700">
      <text x="300" y="20" font-size="14" opacity="0">z
        <animate attributeName="opacity" values="0;0.9;0" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="20;-4" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="x" values="300;312" dur="3s" repeatCount="indefinite"/>
      </text>
      <text x="300" y="20" font-size="18" opacity="0">z
        <animate attributeName="opacity" values="0;0.9;0" dur="3s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="24;-6" dur="3s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="x" values="304;322" dur="3s" begin="1s" repeatCount="indefinite"/>
      </text>
      <text x="300" y="20" font-size="22" opacity="0">Z
        <animate attributeName="opacity" values="0;0.9;0" dur="3s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="26;-4" dur="3s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="x" values="306;332" dur="3s" begin="2s" repeatCount="indefinite"/>
      </text>
    </g>
    <text x="240" y="100" text-anchor="middle" font-size="14" fill="#8D92A0">You scrolled all the way down. He fell asleep waiting.</text>
  </g>
</svg>
