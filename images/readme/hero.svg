<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Gloop, a black notch with two glowing eyes at the top of a Windows desktop, watches a cursor come closer, opens into a music player when it is clicked, then closes and lets a drop of goo fall">
  <defs>
    <clipPath id="frame"><rect width="960" height="400" rx="18"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <g clip-path="url(#frame)" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,sans-serif">
    <!-- wallpaper -->
    <rect width="960" height="400" fill="#12152A"/>
    <g filter="url(#soft)">
      <circle cx="190" cy="310" r="180" fill="#2A3F8F" opacity="0.6">
        <animate attributeName="cx" values="190;240;190" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="790" cy="110" r="160" fill="#5B2A8F" opacity="0.45">
        <animate attributeName="cy" values="110;160;110" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="370" r="140" fill="#1F6F8F" opacity="0.45"/>
    </g>

    <!-- taskbar -->
    <rect y="368" width="960" height="32" fill="#0B0C10" opacity="0.88"/>
    <g fill="#2A2E3B">
      <rect x="404" y="376" width="16" height="16" rx="4" fill="#4FB4FF"/>
      <rect x="432" y="376" width="16" height="16" rx="4"/>
      <rect x="460" y="376" width="16" height="16" rx="4"/>
      <rect x="488" y="376" width="16" height="16" rx="4"/>
      <rect x="516" y="376" width="16" height="16" rx="4"/>
      <rect x="544" y="376" width="16" height="16" rx="4"/>
    </g>

    <!-- the notch: closed, opens into a player, squishes shut -->
    <rect x="405" y="-24" width="150" height="64" rx="24" fill="#050608" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5">
      <animate attributeName="width" dur="10s" repeatCount="indefinite" values="150;150;580;560;560;176;150;150" keyTimes="0;0.25;0.32;0.36;0.7;0.78;0.82;1" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1;0.4 0 0.2 1;0 0 1 1;0.5 0 0.3 1;0.3 0 0.3 1;0 0 1 1"/>
      <animate attributeName="x" dur="10s" repeatCount="indefinite" values="405;405;190;200;200;392;405;405" keyTimes="0;0.25;0.32;0.36;0.7;0.78;0.82;1" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1;0.4 0 0.2 1;0 0 1 1;0.5 0 0.3 1;0.3 0 0.3 1;0 0 1 1"/>
      <animate attributeName="height" dur="10s" repeatCount="indefinite" values="64;64;296;284;284;54;64;64" keyTimes="0;0.25;0.32;0.36;0.7;0.78;0.82;1" calcMode="spline" keySplines="0 0 1 1;0.3 0 0.2 1;0.4 0 0.2 1;0 0 1 1;0.5 0 0.3 1;0.3 0 0.3 1;0 0 1 1"/>
      <animate attributeName="rx" dur="10s" repeatCount="indefinite" values="24;24;40;34;34;22;24;24" keyTimes="0;0.25;0.32;0.36;0.7;0.78;0.82;1"/>
    </rect>

    <!-- a drop of goo falls after he closes -->
    <ellipse cx="480" cy="40" rx="0" ry="0" fill="#050608" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.2">
      <animate attributeName="cy" dur="10s" repeatCount="indefinite" values="40;40;46;54;360;360" keyTimes="0;0.82;0.86;0.89;0.97;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.6 1;0.4 0 0.6 1;0.6 0 1 1;0 0 1 1"/>
      <animate attributeName="rx" dur="10s" repeatCount="indefinite" values="0;0;5;6;5;0" keyTimes="0;0.82;0.86;0.89;0.97;1"/>
      <animate attributeName="ry" dur="10s" repeatCount="indefinite" values="0;0;7;9;8;0" keyTimes="0;0.82;0.86;0.89;0.97;1"/>
    </ellipse>
    <ellipse cx="480" cy="368" rx="0" ry="0" fill="#4FB4FF" opacity="0">
      <animate attributeName="rx" dur="10s" repeatCount="indefinite" values="0;0;26;0" keyTimes="0;0.965;0.995;1"/>
      <animate attributeName="ry" dur="10s" repeatCount="indefinite" values="0;0;4;0" keyTimes="0;0.965;0.995;1"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.7;0" keyTimes="0;0.965;0.97;1"/>
    </ellipse>

    <!-- the player inside the open notch -->
    <g opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.65;0.69;1"/>
      <rect x="232" y="72" width="112" height="112" rx="16" fill="#1E2A4A"/>
      <circle cx="270" cy="112" r="34" fill="#4FB4FF" opacity="0.85"/>
      <circle cx="312" cy="150" r="26" fill="#FF8A5B" opacity="0.85"/>
      <text x="368" y="96" font-size="12" letter-spacing="1.5" fill="#8D92A0">NOW PLAYING</text>
      <text x="368" y="126" font-size="24" font-weight="600" fill="#F2F3F7">Lo-fi to wobble to</text>
      <text x="368" y="152" font-size="14" fill="#9EA3B0">Gloop FM · Side A</text>
      <g fill="#4FB4FF">
        <rect x="690" y="84" width="6" height="16" rx="3"><animate attributeName="height" values="16;6;20;10;16" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="84;94;80;90;84" dur="0.9s" repeatCount="indefinite"/></rect>
        <rect x="700" y="84" width="6" height="16" rx="3"><animate attributeName="height" values="8;20;12;18;8" dur="0.7s" repeatCount="indefinite"/><animate attributeName="y" values="92;80;88;82;92" dur="0.7s" repeatCount="indefinite"/></rect>
        <rect x="710" y="84" width="6" height="16" rx="3"><animate attributeName="height" values="18;10;16;6;18" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="82;90;84;94;82" dur="0.8s" repeatCount="indefinite"/></rect>
        <rect x="720" y="84" width="6" height="16" rx="3"><animate attributeName="height" values="10;16;6;20;10" dur="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="90;84;94;80;90" dur="0.6s" repeatCount="indefinite"/></rect>
      </g>
      <rect x="368" y="172" width="360" height="4" rx="2" fill="#2A2D38"/>
      <rect x="368" y="172" width="60" height="4" rx="2" fill="#4FB4FF">
        <animate attributeName="width" dur="10s" repeatCount="indefinite" values="60;60;210;210" keyTimes="0;0.36;0.68;1"/>
      </rect>
      <path d="M508 204v20M526 204l-14 10 14 10z" stroke="#C9CCD6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#C9CCD6"/>
      <circle cx="548" cy="214" r="18" fill="#F2F3F7"/>
      <rect x="541" y="206" width="5" height="16" rx="1.5" fill="#0B0C10"/>
      <rect x="550" y="206" width="5" height="16" rx="1.5" fill="#0B0C10"/>
      <path d="M588 204v20M570 204l14 10-14 10z" stroke="#C9CCD6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#C9CCD6"/>
      <g fill="#3A3E4A">
        <circle cx="436" cy="246" r="4" fill="#4FB4FF"/>
        <circle cx="462" cy="246" r="4"/>
        <circle cx="488" cy="246" r="4"/>
        <circle cx="514" cy="246" r="4"/>
        <circle cx="540" cy="246" r="4"/>
      </g>
    </g>

    <!-- his eyes: look at the cursor, blink, bob to the music -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="0 0;7 4;9 6;4 7;0 4;0 6;0 4;0 6;0 0;0 0" keyTimes="0;0.08;0.18;0.24;0.36;0.44;0.52;0.6;0.72;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.2 1;0 0 1 1"/>
      <g filter="url(#glow)" fill="#4FB4FF" opacity="0.9">
        <ellipse cx="465" cy="19" rx="8" ry="10"><animate attributeName="ry" dur="10s" repeatCount="indefinite" values="10;10;1.5;10;10;1.5;10;10;1.5;10;10" keyTimes="0;0.04;0.05;0.06;0.5;0.51;0.52;0.88;0.89;0.9;1"/></ellipse>
        <ellipse cx="495" cy="19" rx="8" ry="10"><animate attributeName="ry" dur="10s" repeatCount="indefinite" values="10;10;1.5;10;10;1.5;10;10;1.5;10;10" keyTimes="0;0.04;0.05;0.06;0.5;0.51;0.52;0.88;0.89;0.9;1"/></ellipse>
      </g>
      <g fill="#EAF6FF">
        <ellipse cx="465" cy="19" rx="6" ry="8"><animate attributeName="ry" dur="10s" repeatCount="indefinite" values="8;8;1;8;8;1;8;8;1;8;8" keyTimes="0;0.04;0.05;0.06;0.5;0.51;0.52;0.88;0.89;0.9;1"/></ellipse>
        <ellipse cx="495" cy="19" rx="6" ry="8"><animate attributeName="ry" dur="10s" repeatCount="indefinite" values="8;8;1;8;8;1;8;8;1;8;8" keyTimes="0;0.04;0.05;0.06;0.5;0.51;0.52;0.88;0.89;0.9;1"/></ellipse>
      </g>
    </g>

    <!-- the cursor that pokes him -->
    <circle cx="540" cy="52" r="0" fill="none" stroke="#EAF6FF" stroke-width="2" opacity="0">
      <animate attributeName="r" dur="10s" repeatCount="indefinite" values="0;0;26;26" keyTimes="0;0.245;0.31;1"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;0.8;0;0" keyTimes="0;0.245;0.25;0.31;1"/>
    </circle>
    <g opacity="0">
      <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="820 330;820 330;540 52;540 52;760 330;760 330" keyTimes="0;0.08;0.24;0.28;0.45;1" calcMode="spline" keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.6 1;0 0 1 1"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.06;0.1;0.38;0.45;1"/>
      <path d="M0 0L0 22L6 17L10 26L14 24L10 15L17 15Z" fill="#FFFFFF" stroke="#0B0C10" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
